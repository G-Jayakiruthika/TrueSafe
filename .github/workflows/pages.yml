# Publishes a static, front-end-only preview of TrueSafe to GitHub Pages.
#
# The real app needs the Express backend on Cloud Run. This build sets VITE_DEMO=1,
# which swaps the API client for the local demo module, so the whole interface can
# be walked through from a static host with no server, no keys and no database.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement:true switches Pages on the first time this runs, so the repo
      # needs no manual setup, and reports the base URL the site will be served at.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build the static preview
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_DEMO: '1'
        run: npm run build

      - name: SPA fallback and no-Jekyll
        working-directory: frontend/dist
        # Pages serves 404.html for any unknown path, which is how a client-side
        # router survives a deep link or a refresh on a static host.
        run: |
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
